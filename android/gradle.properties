# Project-wide Gradle settings.
# Heap is deliberately modest: this build is verified on a machine with limited
# free RAM. Bump these on beefier machines if you want faster builds.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
# Kotlin compilation: run in-process — the separate Kotlin daemon cannot be
# spawned reliably in restricted environments and on low-RAM machines.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m
# File watching fails under restricted environments (JNI thread access denied)
org.gradle.vfs.watch=false

# 依赖下载慢时，可让 Gradle 走本机代理（解除注释并按实际代理端口修改；
# 此示例为 v2rayN/clash 常见默认端口。机器级配置可写入 GRADLE_USER_HOME/gradle.properties，
# 避免把代理地址提交进仓库）
# 本机直连受限，构建已启用代理（按本机实际端口修改）：
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=10808
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=10808
systemProp.http.nonProxyHosts=localhost|127.0.0.1

# AndroidX package structure
android.useAndroidX=true
# Kotlin code style for this project is "official"
kotlin.code.style=official
# Only keep the resource IDs we actually declare
android.nonTransitiveRClass=true
